databaseChangeLog:
  - changeSet:
      id: 1
      author: RahatAli
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - createTable:
            tableName: roles
            columns:
              - column:
                  name: roleId
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: roleName
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: roleId
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_roles
            columnNames: roleId, username
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: roleId
            referencedTableName: roles
            referencedColumnNames: roleId
            constraintName: fk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: username
            referencedTableName: users
            referencedColumnNames: username
            constraintName: fk_user_name
