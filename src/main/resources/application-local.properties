spring.application.name=auth-service
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/AuthZ?useSSL=false
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# App Properties
app.jwtSecret= secretKeyRahatAliCognizantSecretKeyForAuthServices808756
app.jwtExpirationMs= 86400000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka= true
eureka.client.fetch-registry: true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Optional: Customize OpenAPI docs path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=DEBUG


spring.kafka.topic=user-profile

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.redis.host=localhost
spring.redis.port=6379