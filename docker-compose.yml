version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: AuthService
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:mysql://db:3306/AuthZ?allowPublicKeyRetrieval=true
    depends_on:
      - db

  db:
    image: mysql/mysql-server:latest
    container_name: mysql-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: AuthZ
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
